name: Negative Login Security Observation

on:
  schedule:
    - cron: '*/10 * 6-8 10 *'
  workflow_dispatch:
    inputs:
      attempts:
        description: 'Maximum synthetic invalid-login attempts (1-100)'
        type: number
        required: true
        default: 5
      interval_ms:
        description: 'Minimum gap after each attempt in milliseconds (5000-60000)'
        type: number
        required: true
        default: 10000

permissions:
  contents: read

jobs:
  observation-window:
    name: Check login test window
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - name: Check whether the scheduled observation is still active
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cutoff=$(date -u -d '2026-10-08T11:30:00Z' +%s)
          now=$(date -u +%s)
          if [ "$EVENT_NAME" != 'schedule' ] || [ "$now" -lt "$cutoff" ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi

  negative-login:
    name: Unique credential submissions (${{ inputs.attempts || 5 }} attempts)
    needs: observation-window
    if: ${{ needs.observation-window.outputs.active == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      tests_outcome: ${{ steps.tests.outcome || 'failure' }}
      allure_artifact_ready: ${{ steps.allure-artifact.outcome == 'success' }}
      pages_artifact_ready: ${{ steps.pages-artifact.outcome == 'success' }}
    env:
      CI: 'true'
      HEADLESS: 'true'
      EXECUTION_PLATFORM: local
      AI_HEALING_ENABLED: 'false'
      LOGIN_SECURITY_ATTEMPTS: ${{ inputs.attempts || 5 }}
      LOGIN_SECURITY_INTERVAL_MS: ${{ inputs.interval_ms || 10000 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        id: dependencies
        run: npm ci
      - name: Install browser system dependencies
        run: npx playwright install-deps chrome
      - name: Clear this suite's previous Allure results
        run: rm -rf allure-results/login-security
      - name: Confirm observation window before test execution
        id: test-window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cutoff=$(date -u -d '2026-10-08T11:30:00Z' +%s)
          now=$(date -u +%s)
          if [ "$EVENT_NAME" != 'schedule' ] || [ "$now" -lt "$cutoff" ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Run unique-credential login tests
        id: tests
        if: ${{ steps.test-window.outputs.active == 'true' }}
        continue-on-error: true
        run: npm run test:login-security

      # Preserve raw evidence even when individual tests fail.
      - name: Upload test results and failure screenshots
        if: ${{ !cancelled() && (steps.test-window.outputs.active == 'true' || steps.test-window.outcome == 'skipped') }}
        uses: actions/upload-artifact@v4
        with:
          name: login-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            allure-results/login-security/
            test-results/login-security/
            playwright-report/login-security/
          if-no-files-found: warn
          retention-days: 14

      - name: Generate Allure report
        id: report
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.test-window.outputs.active == 'true' }}
        run: |
          mkdir -p allure-results/login-security
          npx allure generate -o allure-report allure-results/login-security

      - name: Bundle portable Allure report
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        run: node framework/utils/bundle-allure-report.js ./allure-report ./allure-report-portable.html

      - name: Upload Allure report
        id: allure-artifact
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: login-security-allure-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            allure-report/
            allure-report-portable.html
          retention-days: 30

      - name: Stage versioned Allure report
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p "publish/login-security/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          mkdir -p publish/login-security/latest
          cp -r allure-report/. "publish/login-security/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          cp -r allure-report/. publish/login-security/latest/

      - name: Upload report for serialized GitHub Pages publishing
        id: pages-artifact
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: login-security-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: publish/
          retention-days: 1

      - name: Preserve test failure status
        if: ${{ !cancelled() && steps.test-window.outputs.active == 'true' && steps.tests.outcome != 'success' }}
        run: |
          echo 'Login submission tests did not pass. See the Allure report and screenshots.'
          exit 1

  publish-report:
    name: Publish Allure to GitHub Pages
    needs: negative-login
    if: ${{ !cancelled() && needs.negative-login.outputs.pages_artifact_ready == 'true' }}
    concurrency:
      group: allure-gh-pages-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: login-security-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: publish/
      - name: Publish Allure to GitHub Pages
        id: publish
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          keep_files: true
          commit_message: 'deploy: login-security ${{ github.run_id }} attempt ${{ github.run_attempt }}'
      - name: Link published Allure report
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/login-security/runs/${{ github.run_id }}/${{ github.run_attempt }}/
        run: echo "[Open this run's Allure report](${REPORT_URL})" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify existing Slack channel
    needs: [negative-login, publish-report]
    if: ${{ !cancelled() && needs.negative-login.outputs.allure_artifact_ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: login-security-allure-report-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Notify existing Slack channel
        run: node framework/utils/slack-notify.js
        env:
          SLACK_ENABLED: 'true'
          SLACK_REQUIRED: 'true'
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_SUITE_NAME: 'Unique Credential Login (${{ inputs.attempts || 5 }} attempts)'
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ needs.publish-report.outputs.published == 'true' && format('https://{0}.github.io/{1}/login-security/runs/{2}/{3}/', github.repository_owner, github.event.repository.name, github.run_id, github.run_attempt) || '' }}
          TEST_OUTCOME: ${{ needs.negative-login.outputs.tests_outcome || 'failure' }}
          HEAL_ENABLED: 'false'