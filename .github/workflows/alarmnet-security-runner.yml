name: AlarmNet security compatibility caller

on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
      iterations:
        type: number
        required: true
      iteration_override:
        type: string
        default: ''
      interval_ms:
        type: number
        default: 10000
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  security:
    permissions:
      contents: write
    uses: ./.github/workflows/test-execution.yml
    with:
      suite: ${{ inputs.suite }}
      iterations: ${{ inputs.iteration_override || format('{0}', inputs.iterations) }}
      interval_ms: ${{ inputs.interval_ms }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}