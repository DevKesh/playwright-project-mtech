name: AlarmNet security reusable runner

on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
      iterations:
        type: number
        required: true
      iteration_override:
        type: string
        default: ''
      interval_ms:
        type: number
        default: 10000
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  security-test:
    name: '${{ inputs.suite }} (${{ inputs.iteration_override || inputs.iterations }} iterations)'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tests_outcome: ${{ steps.tests.outcome || 'failure' }}
      allure_artifact_ready: ${{ steps.allure-artifact.outcome == 'success' }}
      pages_artifact_ready: ${{ steps.pages-artifact.outcome == 'success' }}
    env:
      CI: 'true'
      HEADLESS: 'true'
      EXECUTION_PLATFORM: local
      AI_HEALING_ENABLED: 'false'
      LOGIN_SECURITY_SUITE: ${{ inputs.suite }}
      LOGIN_SECURITY_ATTEMPTS: ${{ inputs.iteration_override || inputs.iterations }}
      LOGIN_SECURITY_INTERVAL_MS: ${{ inputs.interval_ms }}
      SUITE: ${{ inputs.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate suite and iteration settings
        run: |
          node <<'NODE'
          const { securitySettings } = require('./framework/utils/login-security');
          const suites = ['alarmnet-login-security', 'alarmnet-mobile-security', 'alarmnet-forgot-login-security'];
          if (!suites.includes(process.env.SUITE)) throw new Error('Unknown AlarmNet suite');
          securitySettings();
          NODE
      - name: Install dependencies
        id: dependencies
        run: npm ci
      - name: Install browser system dependencies
        run: npx playwright install-deps chrome
      - name: Clear this suite's previous Allure results
        run: rm -rf "allure-results/$SUITE"
      - name: 'Run @${{ inputs.suite }} only'
        id: tests
        continue-on-error: true
        run: npm run "test:$SUITE"
      - name: Upload test results and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            allure-results/${{ inputs.suite }}/
            test-results/${{ inputs.suite }}/
            playwright-report/${{ inputs.suite }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Generate Allure report
        id: report
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          mkdir -p "allure-results/$SUITE"
          npx allure generate -o allure-report "allure-results/$SUITE"
      - name: Bundle portable Allure report
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        run: node framework/utils/bundle-allure-report.js ./allure-report ./allure-report-portable.html
      - name: Upload Allure report
        id: allure-artifact
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.suite }}-allure-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            allure-report/
            allure-report-portable.html
          retention-days: 30
      - name: Stage versioned Allure report
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p "publish/$SUITE/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          mkdir -p "publish/$SUITE/latest"
          cp -r allure-report/. "publish/$SUITE/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          cp -r allure-report/. "publish/$SUITE/latest/"
      - name: Upload report for serialized GitHub Pages publishing
        id: pages-artifact
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.suite }}-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: publish/
          retention-days: 1
      - name: Preserve test failure status
        if: ${{ !cancelled() && steps.tests.outcome != 'success' }}
        run: |
          echo 'The selected AlarmNet suite did not pass. See its Allure report and screenshots.'
          exit 1

  publish-report:
    name: Publish suite Allure report
    needs: security-test
    if: ${{ always() && !cancelled() && needs.security-test.outputs.pages_artifact_ready == 'true' }}
    concurrency:
      group: allure-gh-pages-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.suite }}-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: publish/
      - name: Publish Allure to GitHub Pages
        id: publish
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          keep_files: true
          commit_message: 'deploy: ${{ inputs.suite }} ${{ github.run_id }} attempt ${{ github.run_attempt }}'
      - name: Link published Allure report
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ inputs.suite }}/runs/${{ github.run_id }}/${{ github.run_attempt }}/
        run: echo "[Open this run's Allure report](${REPORT_URL})" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify existing Slack channel
    needs: [security-test, publish-report]
    if: ${{ always() && !cancelled() && needs.security-test.outputs.allure_artifact_ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.suite }}-allure-report-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Notify existing Slack channel
        run: node framework/utils/slack-notify.js
        env:
          SLACK_ENABLED: 'true'
          SLACK_REQUIRED: 'true'
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_SUITE_NAME: '@${{ inputs.suite }} (${{ inputs.iteration_override || inputs.iterations }} iterations)'
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ needs.publish-report.outputs.published == 'true' && format('https://{0}.github.io/{1}/{2}/runs/{3}/{4}/', github.repository_owner, github.event.repository.name, inputs.suite, github.run_id, github.run_attempt) || '' }}
          TEST_OUTCOME: ${{ needs.security-test.outputs.tests_outcome || 'failure' }}
          HEAL_ENABLED: 'false'