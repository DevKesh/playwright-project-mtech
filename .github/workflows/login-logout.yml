name: Login and Logout Tests Only

on:
  # Manual, finite run; no Forgot Password tests or automatic triggers.
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Login/logout executions (integer 1-100; 20 means 20 total tests)'
        required: true
        type: number
        default: 20

permissions:
  contents: read

jobs:
  login-logout:
    permissions:
      contents: write
    uses: ./.github/workflows/test-execution.yml
    with:
      suite: login-logout
      repetitions: ${{ inputs.repetitions }}
    secrets:
      LOGIN_MONITOR_USERNAME: ${{ secrets.LOGIN_MONITOR_USERNAME }}
      LOGIN_MONITOR_PASSWORD: ${{ secrets.LOGIN_MONITOR_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}