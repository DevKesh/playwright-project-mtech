name: 🔥 Daily Smoke Tests

on:
  schedule:
    # Weekdays at 2 AM UTC (9:30 AM IST)
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner type'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
      headed:
        description: 'Run headed (for live demo)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      platform:
        description: 'Execution platform'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - lambda

env:
  CI: 'true'

jobs:
  smoke:
    name: Smoke Tests
    timeout-minutes: 30
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    outputs:
      test_outcome: ${{ steps.run_tests.outcome }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Cache Playwright browsers
      if: ${{ github.event.inputs.platform != 'lambda' }}
      uses: actions/cache@v4
      id: playwright-cache-smoke
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install browser system deps
      if: ${{ github.event.inputs.platform != 'lambda' }}
      run: npx playwright install-deps chrome

    - name: Clean previous results
      run: |
        rm -rf allure-results allure-report playwright-report test-results
        mkdir -p allure-results

    - name: Run smoke tests
      id: run_tests
      continue-on-error: true
      run: npx playwright test --project tc-smoke
      env:
        TC_USERNAME: ${{ secrets.TC_USERNAME }}
        TC_PASSWORD: ${{ secrets.TC_PASSWORD }}
        HEADED: ${{ github.event.inputs.headed || 'false' }}
        EXECUTION_PLATFORM: ${{ github.event.inputs.platform || 'local' }}
        LT_USERNAME: ${{ secrets.LT_USERNAME }}
        LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: smoke-results
        path: |
          allure-results/
          test-results/
        retention-days: 14

  heal:
    name: AI Self-Healing (on failure)
    needs: smoke
    if: needs.smoke.outputs.test_outcome == 'failure'
    timeout-minutes: 20
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Cache Playwright browsers
      if: ${{ github.event.inputs.platform != 'lambda' }}
      uses: actions/cache@v4
      id: playwright-cache-heal
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install browser system deps
      if: ${{ github.event.inputs.platform != 'lambda' }}
      run: npx playwright install-deps chrome

    # Download prior artifact into a side folder ONLY for ai-reports/ context.
    # We must NOT let stale allure-results/ leak into the workspace, otherwise
    # the re-run appends UUID-named results on top of the old ones and the
    # final report shows duplicates of both old failures and new healed runs.
    - name: Download prior test results (side folder)
      uses: actions/download-artifact@v4
      with:
        name: smoke-results
        path: ./prior-results
      continue-on-error: true

    - name: Reset workspace results before heal run
      run: |
        rm -rf allure-results test-results
        mkdir -p allure-results
        # Preserve ai-reports/ history (heal reporter appends to it)
        if [ -d "./prior-results/ai-reports" ]; then
          mkdir -p ai-reports
          cp -r ./prior-results/ai-reports/* ai-reports/ 2>/dev/null || true
        fi

    - name: Re-run with AI healing
      id: heal_run
      continue-on-error: true
      run: npx playwright test --project tc-smoke --retries 1
      env:
        TC_USERNAME: ${{ secrets.TC_USERNAME }}
        TC_PASSWORD: ${{ secrets.TC_PASSWORD }}
        AI_HEALING_ENABLED: 'true'
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        EXECUTION_PLATFORM: ${{ github.event.inputs.platform || 'local' }}
        LT_USERNAME: ${{ secrets.LT_USERNAME }}
        LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

    - name: Upload healed results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: smoke-results-healed
        path: |
          allure-results/
          ai-reports/
        retention-days: 14

  report:
    name: Generate Report & Notify
    needs: [smoke, heal]
    if: always()
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Download both artifacts to SEPARATE folders so we can pick the right one.
    # Healed run is a full re-execution (--retries 1), so it represents the
    # latest verdict and must REPLACE the original — never merge with it
    # (allure JSON files use UUIDs so a merge would duplicate every test).
    - name: Download original smoke results
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: smoke-results
        path: ./original-results

    - name: Download healed smoke results
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: smoke-results-healed
        path: ./healed-results

    - name: Select final allure-results (healed overrides original)
      run: |
        rm -rf allure-results
        mkdir -p allure-results
        if [ -d "./healed-results/allure-results" ] && [ -n "$(ls -A ./healed-results/allure-results 2>/dev/null)" ]; then
          echo "::notice::Using HEALED results for report"
          cp -r ./healed-results/allure-results/. allure-results/ 2>/dev/null || true
        elif [ -d "./original-results/allure-results" ] && [ -n "$(ls -A ./original-results/allure-results 2>/dev/null)" ]; then
          echo "::notice::Using ORIGINAL results for report (heal did not run)"
          cp -r ./original-results/allure-results/. allure-results/ 2>/dev/null || true
        else
          echo "::warning::No allure-results found in either artifact"
        fi

    - name: Check allure-results
      run: |
        COUNT=$(find allure-results -name "*.json" 2>/dev/null | wc -l || echo 0)
        echo "ALLURE_RESULT_COUNT=$COUNT" >> $GITHUB_ENV
        echo "Allure result files: $COUNT"
        if [ "$COUNT" -eq 0 ]; then
          echo "::warning::No allure result files found — tests may not have produced output"
        fi

    - name: Generate Allure report
      run: |
        rm -rf allure-report
        mkdir -p allure-results
        npx allure generate -o ./allure-report ./allure-results

    - name: Bundle portable report
      run: node framework/utils/bundle-allure-report.js ./allure-report ./allure-report-portable.html

    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: smoke-allure-report
        path: |
          allure-report/
          allure-report-portable.html
        retention-days: 30

    # Stage the report for versioned publish:
    #   publish/runs/<run_id>/  — permanent per-run report (Slack links here)
    #   publish/latest/         — rolling pointer to the latest report
    #   publish/index.html      — redirects root → /latest/
    # With keep_files: true on the deploy, older runs remain accessible forever.
    - name: Stage report for versioned publish
      if: github.ref == 'refs/heads/main'
      run: |
        rm -rf publish
        mkdir -p "publish/runs/${{ github.run_id }}"
        mkdir -p publish/latest
        cp -r allure-report/. "publish/runs/${{ github.run_id }}/"
        cp -r allure-report/. publish/latest/
        cat > publish/index.html <<'HTML'
        <!DOCTYPE html>
        <html>
          <head>
            <meta http-equiv="refresh" content="0; url=./latest/">
            <title>Allure Report — redirecting…</title>
          </head>
          <body>
            <p>Redirecting to the <a href="./latest/">latest Allure report</a>.</p>
          </body>
        </html>
        HTML
        echo "Staged: $(find publish -maxdepth 2 -type d)"

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./publish
        keep_files: true
        commit_message: "deploy: run ${{ github.run_id }} (${{ github.sha }})"

    - name: Notify Slack
      if: always()
      run: node framework/utils/slack-notify.js
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Per-run permanent URL — does NOT change when later runs deploy.
        REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/runs/${{ github.run_id }}/
        TEST_OUTCOME: ${{ needs.smoke.outputs.test_outcome }}
        HEAL_ENABLED: ${{ needs.heal.result != 'skipped' && 'true' || 'false' }}

