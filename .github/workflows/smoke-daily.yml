name: Daily Smoke Tests

on:
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner type (self-hosted requires Linux and bash)'
        required: true
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, self-hosted]
      headed:
        description: 'Run headed (self-hosted display required)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      platform:
        description: Execution platform
        required: false
        default: local
        type: choice
        options: [local, lambda]

permissions:
  contents: read

jobs:
  smoke:
    permissions:
      contents: write
    uses: ./.github/workflows/test-execution.yml
    with:
      suite: smoke
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      headed: ${{ inputs.headed == 'true' }}
      platform: ${{ inputs.platform || 'local' }}
    secrets:
      LOGIN_MONITOR_USERNAME: ${{ secrets.LOGIN_MONITOR_USERNAME }}
      LOGIN_MONITOR_PASSWORD: ${{ secrets.LOGIN_MONITOR_PASSWORD }}
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

