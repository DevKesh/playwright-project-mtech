name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Suite (generated/total-connect/all are compatibility aliases for tc2)'
        required: false
        default: generated
        type: choice
        options: [generated, total-connect, smoke, regression, tc2, all]
      platform:
        description: Execution platform
        required: false
        default: local
        type: choice
        options: [local, lambda]

permissions:
  contents: read

jobs:
  tests:
    permissions:
      contents: write
    uses: ./.github/workflows/test-execution.yml
    with:
      suite: ${{ inputs.test_suite || 'generated' }}
      platform: ${{ inputs.platform || 'local' }}
    secrets:
      LOGIN_MONITOR_USERNAME: ${{ secrets.LOGIN_MONITOR_USERNAME }}
      LOGIN_MONITOR_PASSWORD: ${{ secrets.LOGIN_MONITOR_PASSWORD }}
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

