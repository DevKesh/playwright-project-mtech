name: '@alarmnet-forgot-login-security | AlarmNet Forgot Login (read-only)'

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Optional positive integer override; blank uses iterations below (values above 100 allowed)'
        type: string
        required: false
      interval_ms:
        description: 'Minimum delay after each iteration per worker (5000-60000 ms)'
        type: number
        default: 10000

permissions:
  contents: read

concurrency:
  group: alarmnet-security-target-${{ github.repository }}
  cancel-in-progress: false

jobs:
  forgot-login:
    name: '/AlarmNet360/AlarmNetDirectV/UserManagement/UserRegistration/ForgotLogin (read-only)'
    permissions:
      contents: write
    uses: ./.github/workflows/test-execution.yml
    with:
      suite: alarmnet-forgot-login-security
      iterations: ${{ inputs.iterations || '100' }}
      interval_ms: ${{ fromJSON(format('{0}', inputs.interval_ms || 10000)) }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}