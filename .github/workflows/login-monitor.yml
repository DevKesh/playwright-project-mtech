name: Login and Forgot Password Tests

on:
  # One finite Playwright invocation per manual run. No automatic triggers.
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Executions of EACH test (integer 1-100; 20 means 40 total tests)'
        required: true
        type: number
        default: 20

permissions:
  contents: read

jobs:
  login-and-recovery:
    permissions:
      contents: write
    uses: ./.github/workflows/test-execution.yml
    with:
      suite: login-monitor
      repetitions: ${{ inputs.repetitions }}
    secrets:
      LOGIN_MONITOR_USERNAME: ${{ secrets.LOGIN_MONITOR_USERNAME }}
      LOGIN_MONITOR_PASSWORD: ${{ secrets.LOGIN_MONITOR_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}